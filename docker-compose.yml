services:
  postgres:
    image: postgres:16-alpine
    container_name: agency-os-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: agency_os
      POSTGRES_USER: agency_os
      POSTGRES_PASSWORD: AgencyOS_2026!Secure
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_os -d agency_os"]
      interval: 10s
      timeout: 5s
      retries: 5
